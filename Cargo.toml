[workspace]
members = [
    "crates/telorgon",
    "crates/telorgon-macros",
    "crates/telorgon-shader-build",
]
resolver = "2"

[workspace.package]
version = "0.1.25"
edition = "2024"
repository = "https://github.com/adamuremek/telorgon"
license = "GPL-3.0-or-later"
readme = "README.md"

[profile.telorgon-profile]
inherits = "release"
debug = 1
incremental = true
strip = "none"

[workspace.dependencies]
async-process = "2.5"
blocking = "1.6"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
futures-lite = "2.6"
libc = "0.2"
signal-hook-registry = "1.4"
telorgon-macros = { version = "=0.1.25", path = "crates/telorgon-macros" }
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }
ash-window = "0.13"
axum = { version = "0.8", features = ["ws"] }
bytemuck = { version = "1", features = ["derive", "must_cast"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "sys-locale"] }
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
rand = "0.9"
raw-window-handle = "0.6"
resvg = { version = "0.48.1", default-features = false }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
softbuffer = "0.4.8"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tinyvec = { version = "1.13.0", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
unicode-segmentation = "=1.13.2"
winit = "0.30.13"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }

[patch.crates-io]
simd-adler32 = { path = "third_party/patches/simd-adler32" }
zune-jpeg = { path = "third_party/patches/zune-jpeg" }
moxcms = { path = "third_party/patches/moxcms" }
cosmic-text = { path = "third_party/patches/cosmic-text" }
