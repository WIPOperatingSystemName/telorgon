format = "v4"
domain = "application"

[tokens.color]
surface = "#181d24ff"
text = "#f3f6fbff"
button = "#365a9fff"
button_hovered = "#466db5ff"
button_pressed = "#29497fff"
button_disabled = "#2b2e37b4"
border = "#6f8bc4ff"
focus = "#a6dbffff"
invalid = "#ff6b78ff"

[tokens.length]
radius = 8
padding = 8
border = 1
outline = 2

[tokens.duration]
fast = 120

[tokens.easing]
standard = "ease-out"

[components.button.default.slots.root]
background = { token = "color.button" }
border_color = { token = "color.border" }
border_width = { token = "length.border" }
radius = { token = "length.radius" }
padding = { token = "length.padding" }

[components.button.default.states.hovered.slots.root]
background = { token = "color.button_hovered" }

[components.button.default.states.pressed.slots.root]
background = { token = "color.button_pressed" }

[components.button.default.states.disabled.slots.root]
background = { token = "color.button_disabled" }

[components.button.default.states.focus-visible.slots.root]
outline_color = { token = "color.focus" }
outline_width = { token = "length.outline" }
outline_offset = 2

[components.button.default.states.invalid.slots.root]
outline_color = { token = "color.invalid" }
outline_width = { token = "length.outline" }

[components.button.default.states.hovered.transition]
duration = { token = "duration.fast" }
easing = { token = "easing.standard" }

[components.button.default.states.pressed.transition]
duration = { token = "duration.fast" }
easing = { token = "easing.standard" }

[components.box.default.slots.root]

[components.text.default.slots.root]
foreground = { token = "color.text" }
