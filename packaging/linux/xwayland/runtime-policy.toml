# Observed ELF closure for the initial Ubuntu 24.04 build. Runtime dlopen/file
# tracing and GPU-driver qualification remain mandatory; this is not that proof.
schema = 1
target = "x86_64-unknown-linux-gnu"
host = [
  "ld-linux-x86-64.so.2", "libc.so.6", "libm.so.6", "libdl.so.2",
  "libpthread.so.0", "librt.so.1", "libresolv.so.2", "libutil.so.1",
  "libgcc_s.so.1", "libdrm.so.2", "libgbm.so.1", "libudev.so.1",
  "libEGL.so.1", "libGL.so.1", "libGLX.so.0", "libGLdispatch.so.0",
  # Mesa's host EGL vendor also links this SONAME. An older private copy can
  # prevent the vendor from loading (e.g. missing wl_fixes_interface).
  "libwayland-client.so.0",
]
private = [
  "libX11.so.6", "libXau.so.6", "libXdmcp.so.6", "libXfont2.so.2",
  "libbrotlicommon.so.1", "libbrotlidec.so.1", "libbsd.so.0", "libbz2.so.1.0",
  "libepoxy.so.0", "libffi.so.8", "libfontenc.so.1", "libfreetype.so.6",
  "libmd.so.0", "libpixman-1.so.0", "libpng16.so.16",
  "libxcb.so.1", "libxcvt.so.0", "libxkbfile.so.1", "libxshmfence.so.1", "libz.so.1",
]
