[package]
name = "telorgon"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
description = "Retained, component-based UI framework with software and Vulkan rendering"

[features]
tray-linux = []
# Ordinary applications compile both managed desktop backends. Runtime entrypoint declarations
# choose between them; downstream applications do not select a renderer with Cargo features.
default = ["application-software", "application-vulkan-windows"]

# Internal switch shared by managed and embedded profiling without forcing the managed web service
# into embedded builds.
instrumentation = ["dep:rtrb"]

application-software = [
    "dep:softbuffer",
    "dep:winit",
    "dep:windows-sys",
]
application-vulkan-linux = [
    "dep:ash", "dep:ash-window", "dep:bytemuck", "dep:gpu-allocator",
    "dep:raw-window-handle", "dep:sha2", "dep:winit",
]
application-vulkan-windows = [
    "dep:ash",
    "dep:ash-window",
    "dep:bytemuck",
    "dep:gpu-allocator",
    "dep:raw-window-handle",
    "dep:sha2",
    "dep:winit",
    "dep:windows",
    "dep:windows-sys",
]
shell-wayland-linux = [
    "dep:roxmltree",
    "dep:ash",
    "dep:bytemuck",
    "dep:gpu-allocator",
    "dep:sha2",
]
pipewire-linux = ["dep:pipewire"]
audio-linux = ["pipewire-linux", "dep:rtrb"]
midi-linux = ["pipewire-linux", "dep:rtrb"]
video-linux = ["pipewire-linux"]
portal-client-linux = ["pipewire-linux", "dep:async-channel", "dep:async-io"]
desktop-audio-linux = ["pipewire-linux", "dep:serde_json"]
shell-screencast-linux = ["shell-wayland-linux", "video-linux", "dep:async-channel", "dep:async-io", "dep:serde_json"]
# Compatibility components; does not start a server or change native defaults.
shell-xwayland = [
    "shell-wayland-linux",
    "dep:x11rb-protocol",
    "dep:x11rb",
    "dep:flate2",
    "dep:serde_json",
]
# Distribution builds supply a validated payload; Cargo never downloads it.
shell-xwayland-embedded = ["shell-xwayland", "dep:serde", "dep:sha2"]
embedded-vulkan = [
    "dep:ash",
    "dep:bytemuck",
    "dep:gpu-allocator",
    "dep:sha2",
]
embedded-profiler = ["instrumentation"]
profiler = [
    "instrumentation",
    "dep:axum",
    "dep:rand",
    "dep:serde_json",
    "dep:tokio",
]

[dependencies]
x11rb-protocol = { version = "=0.13.2", default-features = false, features = ["std", "composite", "randr", "shape", "xfixes", "sync", "render"], optional = true }
x11rb = { version = "=0.13.2", default-features = false, features = ["xfixes"], optional = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"], optional = true }
async-process.workspace = true
blocking.workspace = true
futures-lite.workspace = true
libc.workspace = true
ash = { workspace = true, optional = true }
ash-window = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
cosmic-text.workspace = true
gpu-allocator = { workspace = true, optional = true }
image.workspace = true
rand = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
resvg.workspace = true
rtrb = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
telorgon-macros.workspace = true
thiserror.workspace = true
# fontdb enables only tinyvec/alloc. Enable std for tinyvec 1.13.0's vec! usage;
# Telorgon already requires std, and this must propagate to downstream builds.
tinyvec.workspace = true
tokio = { workspace = true, optional = true }
toml.workspace = true
unicode-segmentation.workspace = true
winit = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = { version = "2.5", optional = true }
async-io = { version = "2.6", optional = true }
pipewire = { version = "=0.10.1", features = ["v0_3_65"], optional = true }
zbus.workspace = true
signal-hook-registry.workspace = true

[dev-dependencies]
roxmltree = "0.21.1"
tower.workspace = true

[build-dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"], optional = true }
roxmltree = { version = "0.21.1", optional = true }

[[test]]
name = "wayland_protocol_generation"
required-features = ["shell-wayland-linux"]

[[example]]
name = "desktop_audio"
required-features = ["desktop-audio-linux"]

[[example]]
name = "audio_playback"
required-features = ["audio-linux"]

[[example]]
name = "midi"
required-features = ["midi-linux"]

[[example]]
name = "midi_forward"
required-features = ["midi-linux"]

[[example]]
name = "video_source"
required-features = ["video-linux"]

[[example]]
name = "video_preview"
required-features = ["video-linux", "portal-client-linux", "application-software"]

[[example]]
name = "video_gpu_capture"
required-features = ["video-linux", "embedded-vulkan"]

[[example]]
name = "video_gpu_source"
required-features = ["video-linux", "embedded-vulkan"]

[[example]]
name = "audio_record"
required-features = ["audio-linux"]

[[example]]
name = "audio_processing"
required-features = ["audio-linux"]

[[example]]
name = "audio_routing"
required-features = ["audio-linux"]

[[example]]
name = "audio_gui"
required-features = ["audio-linux", "application-software"]

[[example]]
name = "desktop_audio_gui"
required-features = ["desktop-audio-linux", "application-software"]

[[example]]
name = "audio_video_sync"
required-features = ["audio-linux", "video-linux", "application-software"]

[[example]]
name = "audio_mixer_gui"
required-features = ["desktop-audio-linux", "application-software"]

[[example]]
name = "tray_publisher"
required-features = ["tray-linux"]
